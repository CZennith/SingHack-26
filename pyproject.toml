[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "singhacks-wealth-database"
version = "0.1.0"
description = "Local DuckDB ingestion and integrity validation for the synthetic wealth dataset"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.0", "pydantic>=2.8,<3", "openai>=1.66,<3"]

[project.optional-dependencies]
test = ["pytest>=8.0", "jsonschema>=4.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live_openai: explicitly authorized test that makes one paid OpenAI API request",
    "integration: read-only integration coverage against the local wealth database",
]
